<!DOCTYPE html>
<html lang='en'>
	<head>
		<title>Math Practice</title>
		<style>
#input-line {
    background-color: black;
    display: flex;
    align-items: center;
    border: 1px solid #00ff00;
    padding: 20px;
}

#prompt {
    color: #00ff00;
    margin-right: 10px;
    margin-left: 10px;    
    font-weight: bold;
}
.problem{
	color: #00ff00;
}

#user-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #00ff00;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    outline: none;
}

#user-input::placeholder {
    color: #008800;
}
		</style>

	</head>
	<body>
		<h1>Math Practice</h1>
        		<div id="input-line">
            			<span id="prompt"></span>
            			<input type="text" id="user-input" placeholder="Type Answer..." autofocus>
        		</div>
			<script src="operation.js"></script>
	</body>
</html>
